<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.are Reality Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1014; --panel:#121a20; --line:#22303a; --text:#e6eef2; --muted:#8aa0ad; --teal:#2E9C98; --gold:#F2C14E; --bad:#e8705f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Outfit, system-ui, sans-serif; }
  header, main, footer { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:26px; margin:8px 0 0; } h1 span { color:var(--gold); }
  .sub { color:var(--muted); margin:0; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .scale-value { font-size:34px; font-weight:700; color:var(--teal); }
  input[type=range] { width:100%; accent-color:var(--teal); }
  .ladder { list-style:none; padding:0; margin:12px 0 0; }
  .ladder li { display:flex; justify-content:space-between; padding:6px 8px; border-radius:8px; cursor:pointer; color:var(--muted); }
  .ladder li.on { background:#1a2a30; color:var(--text); }
  .ladder li b { color:var(--gold); font-weight:600; }
  .entity-name { font-size:22px; font-weight:700; margin:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .chip.ok { border-color:var(--teal); color:var(--teal); } .chip.bad { border-color:var(--bad); color:var(--bad); }
  .chip.gold { border-color:var(--gold); color:var(--gold); }
  button.chip { background:none; cursor:pointer; padding:2px 8px; border-radius:99px; } button.chip:hover { color:var(--text); }
  details { border-top:1px solid var(--line); padding:8px 0; }
  summary { cursor:pointer; font-weight:600; }
  summary small { color:var(--muted); font-weight:400; margin-left:6px; }
  pre { margin:8px 0 0; padding:10px; background:#0b1216; border-radius:8px; overflow:auto; font-size:12px; max-height:320px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button, label.btn { background:#1a2a30; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; cursor:pointer; }
  button:hover, label.btn:hover { border-color:var(--teal); }
  label.btn { white-space:nowrap; padding:3px 10px; display:inline-block; }
  .drop { border:1px dashed var(--line); border-radius:10px; padding:10px; color:var(--muted); text-align:center; margin-top:12px; }
  .drop.over { border-color:var(--gold); color:var(--gold); }
  footer { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Reality Explorer <span>.are</span></h1>
  <p class="sub">Slide from an atom to the universe. Every step is one <code>.are</code> file.</p>
</header>
<main>
  <section class="card">
    <div class="scale-value" id="scaleValue">10⁰ m</div>
    <input id="slider" type="range" min="-10" max="26" step="1" value="0" aria-label="Scale in powers of ten metres">
    <ul class="ladder" id="ladder"></ul>
    <div class="drop" id="drop">Drop your own <code>.are</code> file here, or
      <label class="btn">open one<input type="file" id="file" accept=".are,application/json" hidden></label></div>
  </section>
  <section class="card">
    <p class="entity-name" id="name">Loading…</p>
    <div class="chips" id="chips"></div>
    <p id="summary" class="sub"></p>
    <div class="chips" id="links"></div>
    <div id="layers"></div>
    <div class="row">
      <button id="shareBtn" title="Hide everything except price and history, keep it verifiable">Share view for a buyer</button>
      <button id="fullBtn" hidden>Show full file</button>
      <button id="downloadBtn">Download .are</button>
    </div>
  </section>
</main>
<footer>.are v0.1 · spec CC BY 4.0 · examples CC0 · code Apache 2.0</footer>
<script type="module">
import { verify, disclose, stringify, LAYERS } from "../sdk/js/are.js";

const FILES = ["../examples/hydrogen_atom.are", "../templates/material/porcelain.are", "../examples/coffee_mug.are", "../examples/armchair.are", "../examples/observable_universe.are"];
const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const pow = (n) => "10" + String(n).split("").map((c) => SUP[c]).join("") + " m";
const LAYER_INFO = { header: "identity", spatial: "where and what it is", graph: "how it connects",
  mind_sense: "meaning, notes, plans", timeline: "its life", ledger: "owner, value, sharing" };
const $ = (id) => document.getElementById(id);

let entities = [], current = null, shown = null, templates = new Map();

async function load() {
  try {
    const idx = await (await fetch("../templates/index.json")).json();
    for (const t of idx.templates) templates.set(t.did, { ...t, file: "../templates/" + t.file });
  } catch { /* the explorer works without the template library */ }
  entities = (await Promise.all(FILES.map(async (f) => ({ file: f, data: await (await fetch(f)).json() }))))
    .sort((a, b) => a.data.header.scale_exponent - b.data.header.scale_exponent);
  renderLadder();
  pickByScale(0);
}

function renderLadder() {
  $("ladder").innerHTML = "";
  for (const e of entities) {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><b>${pow(e.data.header.scale_exponent)}</b>`;
    li.firstChild.textContent = e.data.header.name;
    li.onclick = () => { $("slider").value = e.data.header.scale_exponent; pickByScale(e.data.header.scale_exponent); };
    e.li = li; $("ladder").append(li);
  }
}

function pickByScale(n) {
  $("scaleValue").textContent = pow(n);
  const best = entities.reduce((a, b) => Math.abs(b.data.header.scale_exponent - n) < Math.abs(a.data.header.scale_exponent - n) ? b : a);
  if (best !== current) show(best);
}

async function show(e, view = e.data) {
  current = e; shown = view;
  for (const x of entities) x.li?.classList.toggle("on", x === e);
  $("name").textContent = view.header.name;
  const m = view.mind_sense || {};
  $("summary").textContent = m.$redacted ? "Some layers are hidden in this view." : (m.summary || "");
  const r = await verify(view);
  const chips = [
    [pow(view.header.scale_exponent), ""],
    [view.header.privacy_mode, view.header.privacy_mode === "PUBLIC_ONCHAIN" ? "gold" : ""],
    [r.ok ? "✓ verified" : "✗ " + r.errors[0], r.ok ? "ok" : "bad"],
  ];
  if (m.sort_plan) chips.push(["Plan: " + m.sort_plan, "gold"]);
  if (view.ledger?.asking_price) chips.push([`Asking ${view.ledger.asking_price.amount} ${view.ledger.asking_price.currency}`, "gold"]);
  const n = view.timeline?.history?.length || 0;
  if (n) chips.push([n + (n === 1 ? " event" : " events") + " in history", ""]);
  $("chips").innerHTML = "";
  for (const [t, cls] of chips) { const s = document.createElement("span"); s.className = "chip " + cls; s.textContent = t; $("chips").append(s); }
  $("links").innerHTML = "";
  for (const r of view.graph?.relations || []) {
    const t = templates.get(r.target_did);
    const b = document.createElement(t ? "button" : "span");
    b.className = "chip";
    b.textContent = r.type.replace("_", " ") + " → " + (t ? t.name : r.target_did);
    if (t) { b.title = "Open the public template"; b.onclick = () => openFile(t.file); }
    $("links").append(b);
  }
  $("layers").innerHTML = "";
  for (const l of LAYERS) {
    const d = document.createElement("details");
    const hidden = view[l]?.$redacted;
    d.innerHTML = `<summary>${l}<small>${hidden ? "hidden" : LAYER_INFO[l]}</small></summary><pre></pre>`;
    d.querySelector("pre").textContent = JSON.stringify(view[l], null, 2);
    if (!hidden && (view !== e.data ? l !== "header" : (l === "header" || l === "mind_sense"))) d.open = true;
    $("layers").append(d);
  }
  $("fullBtn").hidden = view === e.data;
  $("shareBtn").hidden = view !== e.data;
}

$("slider").oninput = (ev) => pickByScale(Number(ev.target.value));
$("shareBtn").onclick = async () => show(current, await disclose(current.data, ["ledger", "timeline"]));
$("fullBtn").onclick = () => show(current);
$("downloadBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([stringify(shown)], { type: "application/json" }));
  const base = current.file.split("/").pop();
  a.download = shown === current.data ? base : base.replace(/\.are$/, ".shared.are");
  a.click();
};

async function openFile(file) {
  const known = entities.find((x) => x.file === file);
  if (known) { $("slider").value = known.data.header.scale_exponent; $("scaleValue").textContent = pow(known.data.header.scale_exponent); return show(known); }
  openText(file, await (await fetch(file)).text());
}

async function openText(name, text) {
  try {
    const data = JSON.parse(text);
    const e = { file: name, data };
    entities = entities.filter((x) => x.file !== name).concat(e).sort((a, b) => a.data.header.scale_exponent - b.data.header.scale_exponent);
    renderLadder();
    $("slider").value = data.header?.scale_exponent ?? 0;
    $("scaleValue").textContent = pow(data.header?.scale_exponent ?? 0);
    show(e);
  } catch (err) { $("name").textContent = "That file is not valid .are JSON."; }
}
$("file").onchange = async (ev) => { const f = ev.target.files[0]; if (f) openText(f.name, await f.text()); };
const drop = $("drop");
drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = async (ev) => { ev.preventDefault(); drop.classList.remove("over"); const f = ev.dataTransfer.files[0]; if (f) openText(f.name, await f.text()); };

load().catch((err) => { $("name").textContent = "Could not load the examples. Open this page through a web server (see README)."; console.error(err); });
</script>
</body>
</html>
